name: validate-data

on:
  pull_request:
    paths:
      - "public/data/**"
      - "scripts/**"
      - ".github/workflows/validate-data.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public/data against the contract
        run: python3 scripts/validate_data.py
